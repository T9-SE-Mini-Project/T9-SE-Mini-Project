name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # The job name must stay "test": the main branch ruleset requires this status check.
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      # `python -m pytest` puts the repo root on sys.path so `from src.backend...` imports work.
      - name: Unit tests
        run: python -m pytest tests/unit -v --cov=src/backend --cov-report=term

      - name: Integration tests
        run: python -m pytest tests/integration -v --cov=src/backend --cov-append --cov-report=term --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

      # Frontend steps are skipped until the React frontend (BLOOD-24) is merged.
      - name: Check for frontend
        id: frontend
        run: |
          if [ -f src/frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No frontend yet, skipping build."
          fi

      - name: Set up pnpm
        if: steps.frontend.outputs.present == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        if: steps.frontend.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        if: steps.frontend.outputs.present == 'true'
        working-directory: src/frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        if: steps.frontend.outputs.present == 'true'
        working-directory: src/frontend
        run: pnpm build
